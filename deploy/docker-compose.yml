# One command brings up the whole product: database, API, OCR service and HTTPS.
# Run it from this folder:  docker compose up -d --build
# Build the web client first:  cd ../client && npm run build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No ports are published: only the other containers can reach the database.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/nijaat_ai
      OCR_SERVICE_URL: http://ocr:4100
      CLIENT_URL: https://${SITE_DOMAIN}
      API_URL: https://${SITE_DOMAIN}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  ocr:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ocr
    restart: unless-stopped
    # Internal only. Never publish this port: it takes uploads without authentication.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../client/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
